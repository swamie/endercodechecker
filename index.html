<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg:       #080c12;
    --surface:  #0f1623;
    --surface2: #161e2e;
    --border:   #1e2a3a;
    --fg:       #e2e8f0;
    --muted:    #64748b;
    --accent:   #3b7ff5;
    --accent-d: #2563d4;
    --valid:    #22c55e;
    --invalid:  #ef4444;
    --warning:  #f59e0b;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; padding: 0 0 40px; }

  header { border-bottom: 1px solid var(--border); padding: 18px 32px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--bg); z-index: 10; }
  .logo { font-size: 15px; font-weight: 600; letter-spacing: .02em; }

  .token-badge { font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 20px; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); display: flex; align-items: center; gap: 7px; cursor: pointer; transition: border-color .15s; }
  .token-badge:hover { border-color: var(--accent); }
  .token-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); transition: background .2s; }
  .token-badge.active .dot { background: var(--valid); }
  .token-badge.active { color: var(--fg); }

  main { max-width: 820px; margin: 0 auto; padding: 40px 24px 0; display: flex; flex-direction: column; gap: 24px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .card-header { padding: 16px 20px 14px; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }

  textarea { width: 100%; min-height: 180px; background: transparent; border: none; outline: none; resize: vertical; padding: 16px 20px; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.65; color: var(--fg); display: block; }
  textarea::placeholder { color: var(--muted); }

  .actions { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .count-hint { font-size: 12px; color: var(--muted); }

  .btn { padding: 9px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; border: none; transition: background .15s, opacity .15s; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-d); }
  .btn-primary:disabled { opacity: .45; cursor: default; }
  .btn-ghost { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); font-weight: 500; }
  .btn-ghost:hover { color: var(--fg); border-color: #2e3d52; }

  .progress-wrap { padding: 0 20px 16px; display: none; }
  .progress-wrap.visible { display: block; }
  .progress-bar-bg { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 8px; }
  .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; transition: width .3s; }
  .progress-label { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }

  .results-list { max-height: 440px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .result-row { display: flex; align-items: center; gap: 14px; padding: 10px 20px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .result-row:last-child { border-bottom: none; }
  .result-key { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--fg); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result-status { font-size: 11.5px; font-weight: 500; padding: 3px 9px; border-radius: 5px; white-space: nowrap; flex-shrink: 0; }
  .status-valid   { background: #052e16; color: var(--valid); }
  .status-invalid { background: #2d0a0a; color: var(--invalid); }
  .status-warning { background: #2d1f00; color: var(--warning); }
  .status-error   { background: #2d1217; color: #f87171; }

  .empty-state { padding: 48px 20px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.7; }
  .summary-row { display: flex; gap: 20px; padding: 14px 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); background: var(--surface2); }
  .summary-row span b { color: var(--fg); }

  @media (max-width: 540px) {
    header { padding: 14px 16px; }
    main { padding: 24px 12px 0; }
    .result-key { font-size: 11px; }
  }
</style>
</head>
<body>

<header>
  <span class="logo">Key Checker</span>
  <div class="token-badge" id="tokenBadge" onclick="reloadTokens()">
    <span class="dot"></span>
    <span id="tokenText">Loading...</span>
  </div>
</header>

<main>
  <div class="card">
    <div class="card-header">
      <span>Codes</span>
      <button class="btn btn-ghost" style="padding:4px 10px;font-size:11px;" onclick="clearAll()">Clear</button>
    </div>
    <textarea id="codesInput" placeholder="Paste your codes here, one per line"></textarea>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">Checking...</div>
    </div>
    <div class="actions">
      <span class="count-hint" id="countHint">0 codes</span>
      <button class="btn btn-primary" id="checkBtn" onclick="startCheck()">Check Codes</button>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <span>Results</span>
      <span id="resultCount" style="font-size:11px;"></span>
    </div>
    <div class="results-list" id="resultsList">
      <div class="empty-state">Results will appear here as codes are checked.</div>
    </div>
    <div class="summary-row" id="summaryRow" style="display:none">
      <span><b id="sumValid">0</b> valid</span>
      <span><b id="sumInvalid">0</b> invalid</span>
      <span><b id="sumOther">0</b> other</span>
    </div>
  </div>
</main>

<script>
var total = 0, done = 0, validCount = 0, invalidCount = 0, otherCount = 0;
var checking = false;

function updateCount() {
  var n = document.getElementById('codesInput').value.split('\n').filter(function(l){ return l.trim(); }).length;
  document.getElementById('countHint').textContent = n + ' code' + (n === 1 ? '' : 's');
}

function clearAll() {
  document.getElementById('codesInput').value = '';
  updateCount();
  document.getElementById('resultsList').innerHTML = '<div class="empty-state">Results will appear here as codes are checked.</div>';
  document.getElementById('summaryRow').style.display = 'none';
  document.getElementById('resultCount').textContent = '';
  document.getElementById('progressWrap').classList.remove('visible');
}

function reloadTokens() {
  document.getElementById('tokenText').textContent = 'Reloading...';
  fetch('/api/reload', { method: 'POST' }).then(function() { fetchTokens(); });
}

function fetchTokens() {
  fetch('/api/tokens').then(function(r) { return r.json(); }).then(function(d) {
    var badge = document.getElementById('tokenBadge');
    if (d.count > 0) {
      document.getElementById('tokenText').textContent = d.count + ' token' + (d.count === 1 ? '' : 's') + ' active';
      badge.classList.add('active');
    } else {
      document.getElementById('tokenText').textContent = 'No tokens - add to token.txt';
      badge.classList.remove('active');
    }
  });
}

function resetBtn() {
  checking = false;
  var btn = document.getElementById('checkBtn');
  btn.disabled = false;
  btn.textContent = 'Check Codes';
}

function startCheck() {
  if (checking) return;
  var codes = document.getElementById('codesInput').value.trim();
  if (!codes) return;

  checking = true;
  var btn = document.getElementById('checkBtn');
  btn.disabled = true;
  btn.textContent = 'Checking...';
  done = 0; validCount = 0; invalidCount = 0; otherCount = 0;

  var resultsList = document.getElementById('resultsList');
  resultsList.innerHTML = '';
  document.getElementById('summaryRow').style.display = 'none';
  document.getElementById('progressWrap').classList.add('visible');
  document.getElementById('progressFill').style.width = '0%';

  fetch('/api/check', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ codes: codes })
  }).then(function(r) { return r.json(); }).then(function(data) {
    if (data.error) {
      resultsList.innerHTML = '<div class="empty-state" style="color:#f87171">' + data.error + '</div>';
      resetBtn(); return;
    }

    total = data.total;
    document.getElementById('progressLabel').textContent = '0 / ' + total + ' checked';
    document.getElementById('resultCount').textContent = '0 / ' + total;

    var es = new EventSource('/api/stream/' + data.job_id);
    es.onmessage = function(e) {
      var msg = JSON.parse(e.data);
      if (msg.type === 'keepalive') return;
      if (msg.type === 'error') {
        resultsList.innerHTML = '<div class="empty-state" style="color:#f87171">' + msg.message + '</div>';
        es.close(); resetBtn(); return;
      }
      if (msg.type === 'result') {
        done++;
        var kind = msg.kind;
        if (kind === 'valid') validCount++;
        else if (kind === 'invalid') invalidCount++;
        else otherCount++;

        var pct = Math.round(done / total * 100);
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressLabel').textContent = done + ' / ' + total + ' checked';
        document.getElementById('resultCount').textContent = done + ' / ' + total;

        var cls = kind === 'valid' ? 'status-valid' : kind === 'invalid' ? 'status-invalid' : kind === 'warning' ? 'status-warning' : 'status-error';
        var row = document.createElement('div');
        row.className = 'result-row';
        row.innerHTML = '<span class="result-key">' + msg.key + '</span><span class="result-status ' + cls + '">' + msg.status + '</span>';
        resultsList.appendChild(row);
        row.scrollIntoView({ block: 'nearest' });

        document.getElementById('sumValid').textContent = validCount;
        document.getElementById('sumInvalid').textContent = invalidCount;
        document.getElementById('sumOther').textContent = otherCount;
        document.getElementById('summaryRow').style.display = 'flex';
      }
      if (msg.type === 'done') {
        es.close();
        document.getElementById('progressLabel').textContent = 'Done - ' + total + ' codes checked';
        resetBtn();
      }
    };
    es.onerror = function() { es.close(); resetBtn(); };
  });
}

document.getElementById('codesInput').addEventListener('input', updateCount);
fetchTokens();
</script>
</body>
</html>
